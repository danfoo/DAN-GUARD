name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  php-lint:
    name: Lint PHP (module Perfex)
    runs-on: ubuntu-latest
    container: php:8.2-cli
    steps:
      - uses: actions/checkout@v4
      - name: php -l sur tous les fichiers PHP du module
        run: |
          set -e
          find perfex-module -name '*.php' -print0 | xargs -0 -n1 php -l

  android-build:
    name: Build app Android (assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Le runner ubuntu-latest fournit déjà le SDK Android (ANDROID_HOME,
      # platform-34, build-tools) avec licences pré-acceptées. On accepte les
      # licences en best-effort au cas où, sans dépendre d'un chemin précis.
      - name: Accept Android SDK licenses (best-effort)
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

      - name: assembleDebug
        working-directory: android-app
        run: gradle assembleDebug --no-daemon --stacktrace
