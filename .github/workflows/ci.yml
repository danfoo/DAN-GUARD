name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  php-lint:
    name: Lint PHP (module Perfex)
    runs-on: ubuntu-latest
    container: php:8.2-cli
    steps:
      - uses: actions/checkout@v4
      - name: php -l sur tous les fichiers PHP du module
        run: |
          set -e
          find perfex-module -name '*.php' -print0 | xargs -0 -n1 php -l

  android-build:
    name: Build app Android (assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: assembleDebug
        working-directory: android-app
        run: gradle assembleDebug --no-daemon --stacktrace
