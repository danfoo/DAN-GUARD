plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // Décommentez après avoir ajouté google-services.json (Firebase) :
    // id 'com.google.gms.google-services'
}

android {
    namespace 'com.danguard.lock'
    compileSdk 34

    defaultConfig {
        applicationId "com.danguard.lock"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // URL de base du module Perfex. À adapter (ou surchargez à la compilation).
        buildConfigField "String", "PERFEX_BASE_URL", "\"https://votre-perfex.example.com/dan_guard/api/\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Réseau
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Tâches périodiques
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    // Stockage sécurisé du jeton
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Firebase Cloud Messaging (décommentez avec google-services.json)
    // implementation platform('com.google.firebase:firebase-bom:33.1.2')
    // implementation 'com.google.firebase:firebase-messaging-ktx'
}
